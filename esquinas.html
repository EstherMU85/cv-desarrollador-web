<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimiento con clases</title>
    <style>
        * {
            box-sizing: border-box;
        }
        #escenario {
            width: 70%;
            height: 650px;
            border: 5px solid black;
            background-color: darkgrey;
            margin: 2rem auto;
            position: relative;
        }
        .mando {
        	display: grid;
        	grid-template-columns: repeat(3, 1fr);
        	width: 20%;
        	margin: auto;
        	padding: .5rem;
        	border-radius: .25rem;
        	background-color: cadetblue;
            justify-items: anchor-center;
        }

        #btn_topizq, #btn_bottomizq {
	        grid-column: 1 /span 1;
            width: 70px;
            height: 50px;
            font-size: 2rem;
            color: darkcyan;
            text-align: center;
            
        }
        #btn_topder, #btn_bottomder{
            grid-column: 3 / span 1;
            width: 70px;
            height: 50px;
            font-size: 2rem;
            color: darkcyan;
            text-align: center;
        }
        #btn_centro {
	        grid-column: 2 / span 1;
            width: 70px;
            height: 50px;
            font-size: 2rem;
            color: darkcyan;
            text-align: center;
        }

        #elemento {
            width: 60px;
            height: 60px;
            background-color: tomato;
            position: absolute;
            transition:  all 1s;
        }
        /* Clases para las esquina que usaremos en el JavaScript */
        .centro{
            left: calc(50% - 30px);
            top: calc(50% - 30px);
        }
        .top_izq{
            left: 0;
            top:0;
        }
        .top_der{
            top: 0;
            left: calc(100% - 60px);
        }

        .bottom_izq {
            left: 0;
            top: calc(100% - 60px);
        }
        .bottom_derc {
            left: calc(100% - 60px);
            top: caLC(100% - 60PX);
        }

    </style>
</head>
<body>
    <div class="contenedor">
        <h1> Mover elementos en pantalla</h1>
        <div class="botonera">
            <div class="mando">
            <button class="boton" id="btn_topizq">&#8598;</button>
            <button class="boton" id="btn_topder">&#8599;</button>
            <button class="boton" id="btn_centro">⯌</button>
            <button class="boton" id="btn_bottomizq">&#8601;</button>
            <button class="boton" id="btn_bottomder">&#8600;</button>
        </div>
        <!-- <div class="mando-velocidad">
            <label for="in_velocidad">Velocidad:</label>
            <input type="range" min="0" max="250" step="25" id="in_velocidad">
            <input type="text" id="txt_velocidad" readonly>
        </div> -->
        </div>
        <div id="escenario">
            <div id="elemento" class="top_izq"></div>
        </div>
    </div>
    </div>
    <script>
        const elemento = document.getElementById('elemento');

        function esquinaIzq(){
            elemento.className = 'top_izq';
        }
        function esquinaDerc(){
           elemento.className = 'top_der';
        }
        function bottomIzq(){
            elemento.className = 'bottom_izq';
        }
        function bottomDerc(){
            elemento.className = 'bottom_derc';
        }
        function centro(){
            elemento.className = 'centro';
        }

        document.getElementById('btn_topizq').onclick = esquinaIzq;
        document.getElementById('btn_topder').onclick = esquinaDerc;
        document.getElementById('btn_bottomizq').onclick = bottomIzq;
        document.getElementById('btn_bottomder').onclick = bottomDerc;
        document.getElementById('btn_centro').onclick = centro;
        
    </script>
    
</body>
</html>
