<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 17</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Londrina+Sketch&family=Rock+Salt&display=swap');

        :root {
            --titulo: 'Rock Salt';
            --subtitulos: 'Londrina Sketch';
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .contenedor {
            background-color: #8fd326;
            width: 900px;
            margin: auto;
        }

        h1 {
            font-family: var(--titulo);
            font-size: 2rem;
            text-shadow: 2px 2px 2px darkmagenta;
            color: deeppink;
            text-align: center;
            padding: 1rem;
        }
        /* Animacion para el titulo */
        h1:hover {
            text-shadow: 3px 3px 6px darkmagenta;
        }

        h3 {
            font-family: var(--subtitulos);
            color: black;
            
        	text-align: center;
        	font-size: 2rem;
        }
        .discos {
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            gap: 3rem;
            justify-content: space-between;
        }
        .caja {
            width: 400px;
            height: 400px;
            border: 2px solid green;
            overflow: hidden;
            /* esto es para ocultar los elemntos que salen */
            position: relative;
            border-radius: .25rem;
        }
        .caratula {
            position: absolute;
            top: 107%;
            /* display: block; */
            transition: all 1s;
        }
        /* animacion para todo el div que hace que suban los elementos*/
        .todo{
            position: absolute;
        	top: 90%;
        	width: 100%;
            transition: all 1s;

        }
        .caja:hover .todo{
            top: 0;
        }
        /* animacion para el icono */
        .animacion {
        	position: absolute;
        	top: 0;
        	left: 75%;
        	transition: all 1s;
        	font-size: 2rem;
        }

        .caja:hover .animacion {
        	rotate: -180deg;
        	font-size: 1rem;
        	top: 31%;
        }
        
        </style>
</head>

<body>
    <div class="contenedor">
        <h1>1997. El año del punk rock</h1>
        <section class="discos">
            <article class="caja fila-1">
                <div class="todo">
                    <img src="imgs/nevermind-pistols.jpg" alt="caratula de disco1" class="caratula">
                    <h3 class="izq">Sex Pistols</h3>
                    <div class="animacion">&#128228; </div>
                </div>

            </article>
            <article class=" caja fila-1">
               <div class="todo">
                    <img src="imgs/ramones-rocket.jpg" alt="caratula disco 2" class="caratula">
                    <h3 class="izq">Rocket</h3>
                    <div class="animacion">&#128228; </div>
               </div>

            </article>
            <article class="caja fila-2">
                <div class="todo">
                    <img src="imgs/theclash.jpg" alt="caratula disco 3" class="caratula desplazado">
                    <h3 class="tumbao">The clash</h3>
                    <div class="animacion">&#128228; </div>
                </div>

            </article>
            <article class="caja fila-2">
                <div class="todo">
                    <img src="imgs/thejam-city.jpg" alt="caratula disco 4" class="caratula desplazado">
                    <h3 class="tumbao">The Jam</h3>
                    <div class="animacion">&#128228; </div>
    
                </div>
            </article>

        </section>

    </div>

</body>

</html>
