<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .contenedor{
            width: 800px;
        }
        .cantidades, .resultados{
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
        }
        /* Para la calucladora */
        .cantidades {
	        width: 500px;
	        margin: 1rem;
	        gap: 0.1rem;
	        font-family: 'Tahoma';
	        color: darkcyan;
	        font-weight: bold;
        }
        label{
            background-color: lime;
            font-size: 20px;
        }
        input{
            border: 2px solid lime;
            font-size: 20px;
        }
        #btn_calcular {
	        width: 100px;
	        background-color: lime;
	        border-radius: .25rem;
	        font-family: 'Tahoma';
	        color: darkcyan;
	        height: 30px;
	        font-size: 20px;
	        font-weight: bold;
	        box-shadow: 1px 1px 1px black, -1px -1px 1px lightgray;
        }
        /* Para los resultados */
        .resultados {
	        border: 1px solid grey;
	        width: 600px;
	        height: 250px;
	        background-color: lightgrey;
	        gap: 1rem;
	        justify-content: space-evenly;
	        padding: 0 .5rem;
	        margin: auto;
	        display: flex;
	        flex-direction: row;
	        flex-wrap: wrap;
            align-content: center;
        }
        .fila_resultados {
	        width: 100%;
	        display: flex;
        }
        p {
	        background-color: lavender;
	        font-family: 'Tahoma';
	        color: goldenrod;
	        font-size: 15px;
	        font-weight: bold;
	        height: 30px;
	        width: 395px;
        }
        span {
	        background-color: lightgreen;
	        display: block;
	        width: 194px;
	        height: 30px;
        }

        /* Para el final */
        #nombre {
        	width: 700px;
        	background-color: green;
        	height: 50px;
        	text-align: left;
        	color: white;
        	padding: 1rem;
        	font-weight: bold;
        	font-size: 23px;
        	margin: auto;
        	margin-block: 1rem;
        	border: 1px solid black;
        	font-family: 'Tahoma';
        	line-height: 20px;
        }  
            </style>
</head>
<body>
    <div class="contenedor">
        <div class="cantidades">
            <div class="fila">
                <label for="in_num1">intro número 1:</label>
                <input type="number" name="in_num1" id="in_num1">
            </div>
            <div class="fila">
                <label for="in_num2">intro número 2:</label>
                <input type="number" name="in_num2" id="in_num2">
            </div>
            <button id="btn_calcular">Calcular</button>
        </div>
        <div class="resultados">
                <div class="fila_resultados">
                    <p>La suma de los números da:</p>
                    <span id="out_suma"></span>
                </div>
                <div class="fila_resultados">
                    <p>La resta de los números da:</p>
                    <span id="out_resta"></span>
                </div>
                <div class="fila_resultados">
                    <p>La multiplicación de los números da:</p>
                    <span id="out_multi"></span>
                </div>
                <div class="fila_resultados">
                    <p>La división de los números da:</p>
                    <span id="out_div"></span>
                </div>
            <div class="fila_resultados">
                    <p>El resto de la división da:</p>
                    <span id="out_decim"></span>
                </div>
        </div>
            <div id="nombre"></div>
        </div>
    </div>

    <script>
    //Para la ventana y poder poner el nombre
    //No está en ninguna función por que quiero que lo vuelva a preguntar cuando reseteo la página
    const nombre = window.prompt('Escribe tu nombre');
    let contador = 1;
    
    // Función calculadora
    function total() {
        //Leémos los inputs
        let num_1 = document.getElementById('in_num1').value;
        num_1 = parseFloat(num_1);
        //se puede poner estos dos pasos en uno
        //cons num_1 = parseFloat('document.getElementById('in_num1').value');
        let num_2 = document.getElementById('in_num2').value;
        num_2 =parseFloat(num_2);
        
        //Hacemos las operaciones
        let suma = num_1 + num_2;
        let resta = num_1 - num_2;
        let multi = num_1 * num_2;
        let div = num_1 / num_2;
        div = parseInt(div);
        let decimales = num_1 % num_2;
        decimales = parseFloat(decimales);
        
        //Asiganmos en el DOM
        document.getElementById('out_suma').textContent = suma;
        document.getElementById('out_resta').textContent = resta;
        document.getElementById('out_multi').textContent = multi;
        document.getElementById('out_div').textContent = div;
        document.getElementById('out_decim').textContent = decimales;
        //Nombre sale al pulsar
        document.getElementById('nombre').textContent = 'Estos son tus reusltado del cálculo ' + contador + nombre;
        //incremento contador
        contador++;
    }
    //Asignamos función al botón
    document.getElementById('btn_calcular').onclick = total;
    </script>
    
</body>
</html>
